name: Privacy Budget Accountant Laplace CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[server,test]"

    - name: Compile Python and validate browser JavaScript
      run: |
        python -m compileall -q agents dp_laplace_budget cli.py enrichment.py
        node --check web/app.js
        node --test tests/laplace_web.test.cjs

    - name: Check wheel includes browser assets
      run: |
        python -m pip wheel --no-deps --wheel-dir dist .
        python -c "import glob,zipfile; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'web/index.html' in names and 'web/app.js' in names"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
