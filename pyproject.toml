[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-budget-accountant-laplace"
version = "2.0.0"
description = "DP-Laplace: Epsilon Privacy Budget Allocation & Query Noise Injector"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
privacy-budget-accountant-laplace = "cli:main"
dp-laplace-budget = "dp_laplace_budget.cli:main"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "dp_laplace_budget_app"]

[tool.setuptools.packages.find]
include = ["agents*", "dp_laplace_budget*", "web*"]

[tool.setuptools.package-data]
web = ["*.html", "*.js"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/privacy-budget-accountant-laplace"
Repository = "https://github.com/abusuraihsakhri/privacy-budget-accountant-laplace.git"
