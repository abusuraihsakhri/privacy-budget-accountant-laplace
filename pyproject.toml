[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-budget-accountant-laplace"
version = "2.0.0"
description = "DP-Laplace: Epsilon Privacy Budget Allocation & Query Noise Injector"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
privacy-budget-accountant-laplace = "dp_laplace_budget.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/privacy-budget-accountant-laplace"
Repository = "https://github.com/abusuraihsakhri/privacy-budget-accountant-laplace.git"
